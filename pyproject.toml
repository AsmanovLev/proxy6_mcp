[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proxy6-mcp"
version = "1.0.0"
description = "MCP server for PROXY6.net proxy management API"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Deepagent", email = "asmanovlev@gmail.com" },
]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
proxy6-mcp = "proxy6_mcp:main"
